plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.migrationtool'
version = '1.0'
sourceCompatibility = '11'
targetCompatibility = '11'
compileJava.options.encoding     = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

application {
    mainClass = 'com.migrationtool.launcher.LauncherApp'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files('lib/ojdbc11.jar')
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.fifesoft:rsyntaxtextarea:3.5.3'
    implementation 'com.github.vlsi.mxgraph:jgraphx:4.2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

// ── Integration-Tests (eigenes Source-Set, braucht laufende Oracle-DB) ────────
sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

tasks.register('integrationTest', Test) {
    description = 'Startet Integration-Tests gegen Oracle XE (Docker)'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

// ── PITest: Mutation Testing ─────────────────────────────────────────────────
pitest {
    targetClasses = ['com.excelsplit.*', 'com.kostenattribute.*', 'com.mergegen.**']
    targetTests   = ['com.excelsplit.*', 'com.mergegen.**']
    junit5PluginVersion = '1.2.1'
    threads = 4
    outputFormats = ['HTML']
    timestampedReports = false
    mutationThreshold = 0
}

// ── Fat-JAR (Shadow) ─────────────────────────────────────────────────────────
tasks.named('shadowJar') {
    archiveBaseName   = 'MigrationTool'
    archiveClassifier = ''
    archiveVersion    = ''
    mergeServiceFiles()
}

// ── jlink: Minimale JRE erzeugen ─────────────────────────────────────────────
tasks.register('jlinkRuntime', Exec) {
    dependsOn 'shadowJar'

    def runtimeDir = layout.buildDirectory.dir('runtime').get().asFile
    def jdkPath    = project.findProperty('jdkPath') ?: 'C:/Users/maddi/.jdks/openjdk-25.0.2'
    def jlink      = "${jdkPath}/bin/jlink"

    doFirst { delete runtimeDir }

    commandLine jlink,
        '--add-modules', 'java.base,java.desktop,java.sql,java.naming,java.logging,java.management,java.prefs,java.security.jgss,jdk.net,jdk.security.jgss',
        '--strip-debug',
        '--no-man-pages',
        '--no-header-files',
        '--compress=zip-6',
        '--output', runtimeDir.absolutePath
}

// ── Release: Portabler Ordner ─────────────────────────────────────────────────
tasks.register('release', Copy) {
    dependsOn 'shadowJar', 'jlinkRuntime'

    def releaseDir = layout.buildDirectory.dir('release/MigrationTool').get().asFile

    from(tasks.named('shadowJar').map { it.archiveFile }) {
        into '.'
    }
    from(layout.buildDirectory.dir('runtime')) {
        into 'runtime'
    }
    into releaseDir

    doLast {
        file("${releaseDir}/MigrationTool.bat").text =
            '@echo off\r\nstart "" "%~dp0runtime\\bin\\javaw.exe" -jar "%~dp0MigrationTool.jar"\r\n'
        println "=== Release erstellt: ${releaseDir} ==="
    }
}
